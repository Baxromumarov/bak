# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  production-gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.x'

    - name: Run production gate
      run: make production-check

    - name: Verify release checksums
      working-directory: dist
      run: sha256sum --check checksums.txt

    - uses: actions/upload-artifact@v4
      with:
        name: development-release-archives
        path: dist/

  platform-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.x'

    - name: Compile and test host toolchain
      shell: bash
      run: |
        go build -mod=readonly ./cmd/bak ./cmd/bakfmt ./cmd/baklint ./cmd/bakcheck ./lsp
        go test ./...

  vscode-package:
    needs: production-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: vscode
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.x'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: vscode/package-lock.json

    - name: Build and verify VSIX
      run: bash ./scripts/package-vsix.sh

    - uses: actions/upload-artifact@v4
      with:
        name: vscode-${{ matrix.os }}
        path: vscode/*.vsix
