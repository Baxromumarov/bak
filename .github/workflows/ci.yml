name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Verify formatting
              run: |
                  files="$(gofmt -l $(git ls-files '*.go'))"
                  if [ -n "$files" ]; then
                    echo "$files"
                    exit 1
                  fi

            - name: Run focused package tests
              run: |
                  go test ./pkg/formatter ./pkg/linter ./pkg/parser ./pkg/typechecker ./pkg/compiler ./pkg/vm ./pkg/backend/native ./pkg/builtins ./pkg/runtimecap

            - name: Run repository tests
              run: go test ./...
