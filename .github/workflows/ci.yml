name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
  test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Verify formatting
              run: |
                  files="$(gofmt -l $(git ls-files '*.go'))"
                  if [ -n "$files" ]; then
                    echo "$files"
                    exit 1
                  fi

            - name: Enforce camelCase surface policy
              run: bash scripts/check_camelcase_surface.sh

            - name: Run focused package tests
              run: |
                  go test ./pkg/formatter ./pkg/linter ./pkg/parser ./pkg/typechecker ./pkg/compiler ./pkg/vm ./pkg/backend/native ./pkg/builtins ./pkg/runtimecap

            - name: Run repository tests
              run: go test ./...

            - name: Run go vet
              run: go vet ./...

            - name: Run govulncheck
              run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

    frozen-surface:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Run frozen language conformance and docs guardrails
              run: |
                  go test ./pkg/typechecker -run 'TestFrozenV01StableSurfaceParsesAndTypechecksWithoutExperimentalFlags|TestExperimentalUnsafeRequiresOptIn|TestExperimentalUserGenericsRequireOptIn|TestTypecheckerExperimentalFeatureGuardrailIncludesCodeAndHint|TestFrozenSurfaceRejectsOptionConstructorsAndTypes'
                  go test ./pkg/typechecker -run 'TestFrozenSurfaceRejectsOptionMethods'
                  go test ./pkg/typechecker -run 'TestCheck_TypeMismatchIncludesWhereInferredNote|TestCheck_TypeMismatchIdentifierIncludesDeclarationInferenceNote|TestCheck_UseAfterMoveIncludesWhereMovedNote|TestCheck_CannotMoveWhileMutablyBorrowedIncludesWhereBorrowedNote|TestCheck_BorrowConflictIncludesWhereBorrowedNote|TestCheck_DeprecatedFSFunctionAliasWarns|TestCheck_DeprecatedSyncFunctionAliasWarns|TestCheck_DeprecatedMathFunctionAliasWarns'
                  go test ./pkg/typestr -run 'TestRenderTypeGoldenSnapshots|TestRenderTypeForSyntaxGoldenSnapshots'
                  go test ./lsp -run 'TestCompletionGoldenCanonicalCoreMethods|TestSignatureHelpGoldenCoreTypes|TestHoverAndInlayGoldenCoreTypes|TestInlayHintGoldenTypeStringSnapshotsCoreTypes|TestSignatureHelpDoesNotAdvertiseOptionMethods'
                  go test ./cmd/bak -run 'TestStdlibCoreExamplesCompileAndRun|TestStdlibCollectionsExamplesCompileAndRun|TestExampleProjectsSmokeCheck'
                  go test ./cmd/bak -run 'TestPublicDocsAndExamplesLabelExperimentalSurface|TestPublicConformanceTestsLabelExperimentalSurface|TestResolveProjectFeaturesByLanguageMode'

    native-parity:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Run evaluator/vm/native parity matrix
              run: |
                  go test ./pkg/backend/native -run 'TestEvaluatorVMNativeParityMatrix|TestEvaluatorVMNativeOutputParityMatrix'

            - name: Run differential fuzz smoke
              env:
                  FUZZ_TIME: 30s
              run: bash scripts/run_differential_fuzz.sh
